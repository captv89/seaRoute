version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # bufio errors are sticky and checked once at Flush.
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).WriteString
        - fmt.Fprint
        - fmt.Fprintf
        - io.Copy
  exclusions:
    # Unchecked Close, Remove and print calls: best-effort cleanup.
    presets:
      - std-error-handling
